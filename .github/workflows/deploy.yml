name: Deploy to AWS EC2

on:
  push:
    branches: [ main ] 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v3

    - name: SSH를 이용한 EC2 접속 및 배포
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user/workspace  # EC2에 프로젝트가 있는 경로
          git pull origin main
          
          # --- 1. 프론트엔드(Node.js) 빌드 및 실행 ---
          cd frontend
          npm install
          npm run build
          
          # 기존에 돌고 있던 node 프로세스 종료
          pkill -f 'npm run start' || true
          nohup npm run start > /dev/null 2>&1 &
          
          # 백엔드 작업 하기 위해 다시 루트 폴더로 이동
          cd /home/ec2-user/workspace

          # --- 2. 백엔드(Spring Boot) 빌드 및 실행 ---
          echo "=== Backend Deploy Start ==="
        
          # 기존에 돌고 있던 Java(Spring Boot) 프로세스 종료
          pkill -f 'java -jar' || true
        
          # Maven 빌드 (pom.xml 기준)
          mvn clean package -DskipTests
          nohup java -jar target/*.jar > /dev/null 2>&1 &
          echo "=== Deploy Complete ==="